<template>
  <!-- DESC: D7 설계 초안(SC-02) 배치 — 왼쪽 기본 정보 폼, 오른쪽 판정. 좁은 화면에서는 위아래로 쌓인다 -->
  <!-- NOTE: 설계 초안의 가운데 칸(결과 항목 편집기)은 아직 범위 밖이라 윗줄은 2단 -->
  <lightning-layout multiple-rows>
    <lightning-layout-item
      size="12"
      large-device-size="8"
      padding="horizontal-small"
    >
      <lightning-card title="점검 기본 정보" icon-name="standard:record">
        <div class="slds-var-p-horizontal_medium">
          <!-- NOTE: record-form은 Page Layout의 섹션 2단 배치를 따르지 않고 기본 1단으로 그려 세로로 길어진다 → columns="2"로 직접 지정 -->
          <lightning-record-form
            record-id={recordId}
            object-api-name="Inspection__c"
            layout-type="Full"
            columns="2"
            mode="view"
            onsuccess={handleSuccess}
            onerror={handleError}
          ></lightning-record-form>
        </div>
      </lightning-card>
    </lightning-layout-item>
    <lightning-layout-item
      size="12"
      large-device-size="4"
      padding="horizontal-small"
    >
      <c-inspection-judgement-panel
        record-id={recordId}
      ></c-inspection-judgement-panel>
    </lightning-layout-item>

    <!-- DESC: 두 번째 줄 — 왼쪽 이 점검의 시정조치 목록, 오른쪽 조치 추가 폼. 윗줄과 같은 8 : 4 비율 -->
    <lightning-layout-item
      size="12"
      large-device-size="8"
      padding="horizontal-small"
    >
      <lightning-card title="시정조치" icon-name="standard:task">
        <div class="slds-var-p-horizontal_medium">
          <template lwc:if={hasActions}>
            <lightning-datatable
              key-field="Id"
              data={actionRows}
              columns={actionColumns}
              hide-checkbox-column
            ></lightning-datatable>
          </template>
          <template lwc:elseif={isActionsLoaded}>
            <p class="slds-text-color_weak">등록된 시정조치가 없습니다.</p>
          </template>
        </div>
      </lightning-card>
    </lightning-layout-item>
    <lightning-layout-item
      size="12"
      large-device-size="4"
      padding="horizontal-small"
    >
      <!-- NOTE: JS의 inspectionId는 HTML에서 kebab-case(inspection-id)로 쓴다. camelCase로 쓰면 에러 없이 무시된다.
           oncreated = on + 자식이 발행하는 이벤트 이름(created) -->
      <c-corrective-action-form
        inspection-id={recordId}
        oncreated={handleActionCreated}
      ></c-corrective-action-form>
    </lightning-layout-item>
  </lightning-layout>
</template>
